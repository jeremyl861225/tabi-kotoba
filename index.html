<title>旅ことば｜日本旅遊單字卡</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅ことば">
<link rel="preload" href="fonts/zenold-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // 使用者在設定裡指定深淺色時，第一次畫面就套用（開場畫面才不會先閃另一種底色）
  try { var t = (JSON.parse(localStorage.getItem('tabi-kotoba/v1') || '{}').settings || {}).theme; if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  // 開場（js/splash.js）：開場期間先藏住 App 本體，日出結束後才淡入；減少動態效果時沒有開場
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('splashing');
  // 不能縮放（2026-10-03 使用者要求：不要支援雙擊或兩指縮放，固定頁寬）。iOS 會忽略 user-scalable=no，
  // 所以再擋 Safari 的縮放手勢事件與兩指觸控；雙擊放大由 CSS 的 touch-action 擋（不用 JS 擋，數字鍵連按才不會被吃掉）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
</head>
<body>
<!--
THESIS: 在日本看一整天的天色：背景是會慢慢流動的天空（白天／傍晚），所有內容浮在液態玻璃上；路線圖、一站一課、字才是主角。拒絕：米色紙與平面卡片清單（2026-10-01 使用者選 D 主題＋B 字體）。
OWN-WORLD: 自寫著色器的網格漸層天空（白天＝空色、桃、藤、象牙；傍晚＝茜、藤、紺）；液態玻璃面板（半透明白／紺、背景模糊、上緣高光、細白邊）；墨色膠囊主按鈕；Zen Old Mincho 900 的標題與單字、中文內文宋體；分頁列是玻璃底板＋凹口裡的玻璃珠。
STORY: 打開時天亮了、玻璃上浮出「旅」；接著看到下一站的玻璃大格與三條線；字卡用手指拖著換；到了日本離線查字播音。
FIRST VIEWPORT: 開場（夜色→白天、太陽升起、玻璃磚上的「旅」，約 1.7 秒、點一下跳過）；之後左上「旅ことば」與已學字數；下一站玻璃大格（路線章、課名、進度格、出發鍵、流光邊框）；主題家族 3×3 玻璃格；可收合的三條線玻璃面板。
FORM: 使用者在四個試作中選 D 暮色玻璃＋B 東海道的字體，分頁列保留滾球；試作抽籤 be4917ea。
FINISH: 2026-10-02 審查兩輪（第二輪 6 項解決、R1 已修）＋DESIGN.md 已寫；未解：清單的振假名基字偏移、實機效能待測
-->
